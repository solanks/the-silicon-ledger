<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="draftGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D6D1C4" stroke-width="1" />
    </pattern>
    <marker id="arrowVermilion" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D9381E" />
    </marker>
  </defs>

  <!-- Warm Archival Blueprint / Teardown Bench Background (1600x900) -->
  <rect width="1600" height="900" fill="#F4F0E6" />
  <rect width="1600" height="900" fill="url(#draftGrid)" />

  <!-- Outer Technical Frame -->
  <rect x="40" y="40" width="1520" height="820" fill="none" stroke="#141413" stroke-width="4" />

  <!-- Laptop Chassis & Logic Board Cutaway Schematic -->
  <rect x="268" y="168" width="1080" height="600" fill="#141413" />
  <rect x="260" y="160" width="1080" height="600" fill="#FCFBF8" stroke="#141413" stroke-width="5" />
  <rect x="300" y="200" width="1000" height="520" fill="#EFECE4" stroke="#141413" stroke-width="3" />

  <!-- Left Active Cooling Fan -->
  <circle cx="490" cy="370" r="105" fill="#FCFBF8" stroke="#141413" stroke-width="4" />
  <circle cx="490" cy="370" r="42" fill="#141413" />
  <text x="490" y="512" text-anchor="middle" fill="#141413" font-family="ui-monospace, monospace" font-size="18" font-weight="700">FAN #1 (INSTALLED)</text>

  <!-- Center M5 SoC Package (120 GB/s Bus) -->
  <rect x="690" y="280" width="220" height="190" fill="#141413" stroke="#141413" stroke-width="4" />
  <text x="800" y="368" text-anchor="middle" fill="#F7F4EE" font-family="Georgia, serif" font-size="52" font-weight="900">M5</text>
  <text x="800" y="412" text-anchor="middle" fill="#FDECE9" font-family="ui-monospace, monospace" font-size="20" font-weight="800">120 GB/s BUS</text>

  <!-- Right EMPTY Fan Bay (Circled in Signal Vermilion for Google Discover) -->
  <rect x="1005" y="265" width="210" height="210" fill="#FDECE9" stroke="#D9381E" stroke-width="3" stroke-dasharray="10 8" />
  <text x="1110" y="362" text-anchor="middle" fill="#141413" font-family="ui-monospace, monospace" font-size="22" font-weight="800">VACANT BAY</text>
  <text x="1110" y="394" text-anchor="middle" fill="#B02A14" font-family="ui-monospace, monospace" font-size="18" font-weight="800">(NO 2ND FAN)</text>

  <!-- Signal Vermilion Circle & Arrow Callout -->
  <circle cx="1110" cy="370" r="134" fill="none" stroke="#D9381E" stroke-width="8" stroke-dasharray="20 10" />

  <!-- Editorial Callout Stamp + Vermilion Vector Arrow -->
  <rect x="858" y="68" width="590" height="72" fill="#141413" />
  <rect x="850" y="60" width="590" height="72" fill="#D9381E" stroke="#141413" stroke-width="3" />
  <text x="1145" y="105" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="23" font-weight="800">
    MISSING 2ND FAN + 120 GB/s BOTTLENECK (102°C)
  </text>
  <path d="M 1175 132 Q 1205 190 1155 232" fill="none" stroke="#D9381E" stroke-width="7" marker-end="url(#arrowVermilion)" />

  <!-- Bottom Editorial Caption Strip -->
  <rect x="300" y="615" width="1000" height="78" fill="#141413" />
  <text x="800" y="663" text-anchor="middle" fill="#F7F4EE" font-family="Georgia, serif" font-size="28" font-weight="700">
    Fig 1. The $1,599 Base 14&quot; Chassis Omits the Right-Hand Blower &amp; Heatpipe
  </text>
</svg>
