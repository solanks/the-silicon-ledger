<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="gridMedia" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D6D1C4" stroke-width="1" />
    </pattern>
    <marker id="arrowVerm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D9381E" />
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F4F0E6" />
  <rect width="1600" height="900" fill="url(#gridMedia)" />
  <rect x="40" y="40" width="1520" height="820" fill="none" stroke="#141413" stroke-width="4" />

  <rect x="80" y="76" width="580" height="54" fill="#141413" />
  <text x="370" y="111" text-anchor="middle" fill="#F7F4EE" font-family="ui-monospace, monospace" font-size="22" font-weight="800" letter-spacing="1.5">
    MEDIA ECONOMICS // ZERO-CLICK SEARCH DRAIN
  </text>

  <!-- Left Box: Original Lab Journalism ($15,000 Teardown Cost) -->
  <rect x="128" y="238" width="560" height="460" fill="#141413" />
  <rect x="120" y="230" width="560" height="460" fill="#FCFBF8" stroke="#141413" stroke-width="5" />
  <text x="400" y="310" text-anchor="middle" fill="#141413" font-family="Georgia, serif" font-size="38" font-weight="900">
    Original Hardware Lab
  </text>
  <text x="400" y="370" text-anchor="middle" fill="#57534E" font-family="ui-monospace, monospace" font-size="22" font-weight="700">
    • 48 Hours Bench Telemetry
  </text>
  <text x="400" y="415" text-anchor="middle" fill="#57534E" font-family="ui-monospace, monospace" font-size="22" font-weight="700">
    • Retail Sample Purchased
  </text>
  <text x="400" y="460" text-anchor="middle" fill="#57534E" font-family="ui-monospace, monospace" font-size="22" font-weight="700">
    • Die &amp; Thermal Dissection
  </text>
  <rect x="200" y="530" width="400" height="90" fill="#EFECE4" stroke="#141413" stroke-width="3" />
  <text x="400" y="586" text-anchor="middle" fill="#141413" font-family="ui-monospace, monospace" font-size="26" font-weight="800">
    LAB COST: $4,200 / REVIEW
  </text>

  <!-- Right Box: Zero-Click Scraper Box (Circled in Red) -->
  <rect x="928" y="238" width="560" height="460" fill="#141413" />
  <rect x="920" y="230" width="560" height="460" fill="#FDECE9" stroke="#141413" stroke-width="5" />
  <text x="1200" y="310" text-anchor="middle" fill="#D9381E" font-family="Georgia, serif" font-size="38" font-weight="900">
    Zero-Click Summary Box
  </text>
  <text x="1200" y="380" text-anchor="middle" fill="#141413" font-family="ui-monospace, monospace" font-size="22" font-weight="700">
    Scrapes Benchmark Numbers in 0.4s
  </text>
  <text x="1200" y="430" text-anchor="middle" fill="#B02A14" font-family="ui-monospace, monospace" font-size="24" font-weight="800">
    CTR TO SOURCE SITE: -64%
  </text>
  <circle cx="1200" cy="430" r="190" fill="none" stroke="#D9381E" stroke-width="8" stroke-dasharray="20 10" />

  <!-- Arrow Between Boxes -->
  <path d="M 700 450 L 900 450" fill="none" stroke="#D9381E" stroke-width="9" marker-end="url(#arrowVerm)" />
  <text x="800" y="420" text-anchor="middle" fill="#D9381E" font-family="ui-monospace, monospace" font-size="22" font-weight="800">
    INGESTED FREE
  </text>
