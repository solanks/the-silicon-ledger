"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "dist"
  command = "npm run build"
  environment = { NODE_VERSION = "20" }

[context.production]
  publish = "dist"
  command = "npm run build"

# Keep Deploy Previews (PRs) and draft/* Branch Deploys out of Google index before merge
[context.deploy-preview]
  publish = "dist"
  command = "npm run build && cp ./custom-headers/_previewHeaders ./dist/_headers"

[context.branch-deploy]
  publish = "dist"
  command = "npm run build && cp ./custom-headers/_previewHeaders ./dist/_headers"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
