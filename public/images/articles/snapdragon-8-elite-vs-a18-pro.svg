<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="dieLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="dieRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <!-- Silicon Die Left: Snapdragon 8 Elite -->
  <rect x="200" y="180" width="480" height="540" rx="28" fill="#090d16" stroke="#ef4444" stroke-width="4" />
  <rect x="240" y="220" width="400" height="460" rx="12" fill="url(#dieLeft)" fill-opacity="0.25" stroke="#f87171" stroke-width="2" />
  <text x="440" y="420" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="40" font-weight="900">SNAPDRAGON</text>
  <text x="440" y="475" text-anchor="middle" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="34" font-weight="800">8 ELITE (ORYON)</text>
  <text x="440" y="530" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="22">TSMC N3E · 4.32 GHz</text>

  <!-- VS Badge -->
  <circle cx="800" cy="450" r="56" fill="#4f46e5" stroke="#818cf8" stroke-width="4" />
  <text x="800" y="464" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="900">VS</text>

  <!-- Silicon Die Right: Apple A18 Pro -->
  <rect x="920" y="180" width="480" height="540" rx="28" fill="#090d16" stroke="#38bdf8" stroke-width="4" />
  <rect x="960" y="220" width="400" height="460" rx="12" fill="url(#dieRight)" fill-opacity="0.25" stroke="#7dd3fc" stroke-width="2" />
  <text x="1160" y="420" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="40" font-weight="900">APPLE SILICON</text>
  <text x="1160" y="475" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="34" font-weight="800">A18 PRO (6-CORE)</text>
  <text x="1160" y="530" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="22">TSMC N3E · 4.05 GHz</text>
</svg>
